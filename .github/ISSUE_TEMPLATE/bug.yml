name: Bug
description: Something doesn't run or gives a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `uv run craton doctor`
      render: console
    validations:
      required: true
