name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: craton check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the append-only check compares with the base commit

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install (CPU PyTorch)
        run: uv sync --extra cpu --locked

      - name: Doctor
        run: uv run craton doctor --smoke

      - name: Check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          uv run craton check --base "$base"
