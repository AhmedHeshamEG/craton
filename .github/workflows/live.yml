name: Live forecast

# Every night: lock tomorrow's forecast for central Italy, grade the days old enough to grade,
# regenerate forecasts/README.md, push. The model is the frozen bundle attached to the release
# of the installed version; nothing is trained here.

on:
  schedule:
    - cron: "30 22 * * *" # 22:30 UTC: before the next UTC day starts, even if the run is late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install (CPU PyTorch)
        run: uv sync --extra cpu --locked

      - name: The INGV catalogue, cached month by month
        uses: actions/cache@v5
        with:
          path: data/live/central_italy/ingv
          key: ingv-central_italy-${{ github.run_id }}
          restore-keys: ingv-central_italy-

      - name: The frozen model of this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(uv run python -c "import craton; print(craton.__version__)")
          mkdir -p data/live
          gh release download "v$version" --pattern "craton-live-central_italy-v$version.tar.gz" --dir data/live

      - name: Lock tomorrow, grade, page
        run: uv run craton live run

      - name: Verify every seal
        run: uv run craton live verify

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          day=$(date -u -d tomorrow +%F)
          git commit -m "forecast: lock $day"
          git pull --rebase origin main
          git push origin HEAD:main
