# Craton-mini: the laptop twin. Central Italy, an RTX 2060 with 6 GB of VRAM.
# Same code as the big versions; only this file is different.
name: mini
status: active
description: Laptop twin for central Italy. Every phase runs here first.
target_hardware: NVIDIA RTX 2060, 6 GB VRAM, 16 GB RAM (Turing, fp16 + GradScaler, no bf16)
params_range: [2_000_000, 5_000_000]

model:
  d_model: 256        # features per token
  n_layers: 6
  n_heads: 8          # 256 / 8 = 32 features per head
  context_tokens: 1024
  dropout: 0.1
  positional: rope4d  # 4D rotary encoding; "sinusoidal" is the fallback
  inputs:             # one encoder each, into the same space
    - seismic_catalog
    - gnss_daily
    - solid_earth_tide

train:
  precision: fp16
  micro_batch: 16     # windows of 1,024 quakes per step, plus 16 next-day questions
  grad_accum: 1
  lr: 1.0e-3
  weight_decay: 0.05
  seeds: [0, 1, 2]
  max_steps: 4000    # P4's runs were still improving at 2,500
  warmup_steps: 100
  eval_every: 100
  patience: 5         # validation checks without progress before stopping
  mask_share: 0.15    # as in CB-01
  windows:            # the mix of masked windows (craton/train/data.py)
    quake: 0.55
    gnss: 0.45
  split_windows:      # each game trained where it is tested: in-context practice for CB-17 only
    cb17_fit:
      quake: 0.45
      gnss: 0.40
      region: 0.15
  objectives:
    masked: 1.0       # hidden quakes, bits on CB-01's bins
    gnss: 1.0         # hidden GNSS days, bits on CB-01's 1 mm bins
    next_day: 1.0

# How a window of 1,024 is filled: tides, then GNSS, then quakes (craton/train/context.py).
context:
  tides: 25
  tides_ahead: 24
  gnss: 160
  gnss_quake_window: 48
  gnss_days: 7
  gnss_stations: 12
  gnss_km: 100
  next_day_gnss_days: 5
  big_quakes: 32
  big_magnitude: 3.5
