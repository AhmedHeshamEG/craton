# The planet Field (P8f): the first stage of the curriculum, planets -> regions -> central Italy.
# Six physics planets of central Italy's box (craton.field.planets), each also read through a
# network that goes blind after big quakes; none of them is a planet CB-09 scores.
name: planets
description: ETAS start + Omori memory + attention between cells, learned on fake planets.

model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  dropout: 0.1
  max_nudge: 4.0

memory:
  m_min: 1.5
  start: "1990-01-01T00:00:00Z"

train:
  first_day: "1991-01-01T00:00:00Z"
  validation_every: 8
  days_per_step: 8
  lr: 3.0e-4
  weight_decay: 0.01
  max_epochs: 40
  patience: 6
  members: 4
  seeds: [0, 1, 2]

world:
  cut: "2018-01-01T00:00:00Z"   # a planet's whole calendar: it's another planet
  regions: {}
  steps_per_epoch: 500

planets:
  kind: physics_planet
  first_seed: 1000
  count: 6
  blind_twins: true
