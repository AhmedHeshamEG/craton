# The Field as a stress meter (P9f, craton/field/meter.py); otherwise mini, line for line.
# Its own file, so changing the Field never retrains the trunk's checkpoints.
name: meter
description: P6 Field whose only output is a stress per cell; rates through rate-and-state (P9f ablation).

model:
  d_model: 64          # features per cell
  n_layers: 2          # attention layers between cells
  n_heads: 4
  dropout: 0.1
  max_nudge: 4.0       # the Field may move ETAS's rate in a cell at most 4x either way

memory:
  m_min: 1.5           # every quake down to the catalogue's completeness enters the memory
  start: "1990-01-01T00:00:00Z"

train:
  first_day: "1991-01-01T00:00:00Z"   # Colfiorito 1997 too; ETAS (fitted from 2005) is the start everywhere
  validation_every: 8                 # one 30-day block in eight is validation
  days_per_step: 8
  lr: 1.0e-3
  weight_decay: 0.01
  max_epochs: 40
  patience: 5
  members: 6                          # a forecast is the average of this many Fields (P7: 5+ for the spread)
  seeds: [0, 1, 2]

meter:
  stress: true
  t_a_years: 5.0       # aftershock duration every cell starts from (Dieterich 1994: years to decades)
  t_a_factor: 8.0      # each cell learns its own, 0.6 to 40 years
  max_stress: 3.0      # stress anomaly over ETAS's, at most 3 A-sigma either way (a factor 20)
