# P10c: the Field of mini.yaml, listening. Every cell also reads the noise instruments near it
# (craton/field/listen.py): loudness of the stations over their own last 60 days, and dv/v of
# the station pairs. Everything else is mini.yaml's, so the ablation is one change.
name: listen
description: mini's Field plus seismic noise power and dv/v in every cell's input.

model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  dropout: 0.1
  max_nudge: 4.0

memory:
  m_min: 1.5
  start: "1990-01-01T00:00:00Z"

train:
  first_day: "1991-01-01T00:00:00Z"
  validation_every: 8
  days_per_step: 8
  lr: 1.0e-3
  weight_decay: 0.01
  max_epochs: 40
  patience: 5
  members: 6
  seeds: [0, 1, 2]

listen:
  noise_power: true
  velocity: true
