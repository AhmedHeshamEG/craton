# Craton-planet: the whole solid Earth. A GPU cluster, once the scaling law says it's worth it.
# Declared now so nothing in the core assumes one GPU; smoke-tested in P12.
name: planet
status: planned
description: The whole planet, every instrument. A multi-node GPU cluster.
target_hardware: multi-node GPU cluster (bf16, FSDP)
params_range: [1_000_000_000, 10_000_000_000]

model:
  d_model: 2048
  n_layers: 32
  n_heads: 16
  context_tokens: 131072
  dropout: 0.0

train:
  precision: bf16
  micro_batch: 8
  grad_accum: 16
  lr: 1.5e-4
  weight_decay: 0.1
  seeds: [0, 1, 2]
