[project]
name = "craton-earth"
version = "0.5.0"
description = "One model for the solid Earth: a foundation model for geology, built the way LLMs are built."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Hesham" }]
requires-python = ">=3.11"
keywords = [
    "earthquakes",
    "seismology",
    "geophysics",
    "foundation-model",
    "transformer",
    "forecasting",
    "uncertainty",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.1",
    "pyarrow>=26",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "rich>=13.9",
    "scipy>=1.14",
]

[project.optional-dependencies]
# PyTorch comes from one of two exclusive extras, so the same lockfile serves
# an NVIDIA laptop and a CPU-only CI runner.
cu126 = ["torch==2.14.1"]
cpu = ["torch==2.14.1"]

[project.scripts]
craton = "craton.cli:main"

[project.urls]
Homepage = "https://github.com/AhmedHeshamEG/craton"
Roadmap = "https://github.com/AhmedHeshamEG/craton/blob/main/ROADMAP.md"
Issues = "https://github.com/AhmedHeshamEG/craton/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]
figures = [
    "matplotlib>=3.9",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["craton"]

[tool.hatch.build.targets.sdist]
include = ["craton/", "configs/", "tests/", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "RET"]
# ×, – and · are deliberate in user-facing text.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["craton"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# The smoke test drives PyTorch, whose autograd calls are untyped.
module = ["craton.hardware"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# PyArrow and SciPy ship no type information.
module = ["pyarrow", "pyarrow.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ETAS gets its likelihood gradient from PyTorch's autograd, whose calls are untyped.
module = ["craton.bench.etas"]
disallow_untyped_calls = false
